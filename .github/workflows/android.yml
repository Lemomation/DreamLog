name: Android build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dreamlog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      DREAMLOG_KEYSTORE_BASE64: ${{ secrets.DREAMLOG_KEYSTORE_BASE64 }}
      DREAMLOG_KEYSTORE_PASSWORD: ${{ secrets.DREAMLOG_KEYSTORE_PASSWORD }}
      DREAMLOG_KEY_ALIAS: ${{ secrets.DREAMLOG_KEY_ALIAS }}
      DREAMLOG_KEY_PASSWORD: ${{ secrets.DREAMLOG_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-35
            build-tools;35.0.0
            platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Decode release keystore
        if: env.DREAMLOG_KEYSTORE_BASE64 != ''
        env:
          DREAMLOG_KEYSTORE_BASE64: ${{ secrets.DREAMLOG_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$DREAMLOG_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/dreamlog-release.jks"
          test -s "$GITHUB_WORKSPACE/dreamlog-release.jks"

      - name: Build debug and release APKs
        run: |
          chmod +x gradlew
          if [ -s "$GITHUB_WORKSPACE/dreamlog-release.jks" ]; then
            export DREAMLOG_KEYSTORE_PATH="$GITHUB_WORKSPACE/dreamlog-release.jks"
          fi
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease

      - name: Stage APK artifacts
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/DreamLog-${VERSION}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/DreamLog-${VERSION}-release.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/DreamLog-${VERSION}-release-unsigned.apk"
          fi
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DreamLog-${{ github.ref_name }}-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DreamLog ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            DreamLog ${{ github.ref_name }} — offline-first dream log for Android.

            - Hostage alarm with voice and text unlock thresholds.
            - Obsidian-style [[WikiLinks]] with the automatic entity linker.
            - Markdown import/export through Android's Storage Access Framework.
            - Monochrome, non-overlapping force-directed graph.

            Install the release APK on Android 8.0 or newer.
          files: dist/*.apk
          fail_on_unmatched_files: true
